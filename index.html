<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Site icon. Bump ?v= when the icon changes so phones fetch the new one -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arvind Sushil</title>
    <script>
      // Background theme, set before the page paints so there's no flash.
      // White is the default; the circle in the top right switches it and the choice is
      // remembered on this browser. ?theme=dark / ?theme=light in the URL overrides it.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) { try { theme = localStorage.getItem('site-theme'); } catch (e) {} }
        if (theme !== 'dark') document.documentElement.dataset.theme = 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
